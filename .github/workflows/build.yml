name: Build Windows VST3

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64 -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release --parallel 3
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Upload VST3 bundle
        uses: actions/upload-artifact@v4
        with:
          name: Takt-II-Windows-VST3
          path: build/TaktII_artefacts/Release/VST3/Takt II.vst3
          if-no-files-found: error
